<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0}</style>
<title>상승률 200</title>
<meta name="robots" content="noindex,nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600&amp;family=Noto+Serif+KR:wght@600&amp;display=swap">
<style>
/* 레이아웃: 상단 탭 5개. 통계 요약 → 목록 → 차트 → 조건검색 → 일별 상위 200. 한국 시장 관례: 상승 빨강, 하락 파랑 */
:root{--bg:#f4f6f9;--panel:#fff;--ink:#14202e;--ink-2:#3b4a5c;--ink-3:#8793a3;--line:#dfe4ea;--accent:#2a6fdb;--up:#d6453d;--down:#2a6fdb;--soft:#eaf1fc;--mark:#e08a1e;--warn:#fff4e0;--blue:#2a6fdb;--orange:#e08a1e;--orange-ink:#a4600a;--red:#d6453d;--red-ink:#b3322b;--good:#1f8a5b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151d;--panel:#171f2a;--ink:#e8edf3;--ink-2:#b4c0cd;--ink-3:#7c8a9b;--line:#273241;--accent:#6aa3ff;--up:#ff6b61;--down:#6aa3ff;--soft:#1b2a40;--mark:#f0a63f;--warn:#33281a;--blue:#6aa3ff;--orange:#f0a63f;--orange-ink:#f3b765;--red:#ff7a70;--red-ink:#ff958c;--good:#4ccf95;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f151d;--panel:#171f2a;--ink:#e8edf3;--ink-2:#b4c0cd;--ink-3:#7c8a9b;--line:#273241;--accent:#6aa3ff;--up:#ff6b61;--down:#6aa3ff;--soft:#1b2a40;--mark:#f0a63f;--warn:#33281a;--blue:#6aa3ff;--orange:#f0a63f;--orange-ink:#f3b765;--red:#ff7a70;--red-ink:#ff958c;--good:#4ccf95;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:14px/1.6 'Noto Sans KR',system-ui,sans-serif;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:1000px;margin:0 auto;min-width:0}
h1{font:600 24px/1.3 'Noto Serif KR',serif;margin:0}
h2{font:600 19px/1.35 'Noto Serif KR',serif;margin:0 0 4px;text-wrap:balance}
h3{font-size:14.5px;margin:16px 0 2px}
p{margin:6px 0}
.sub{color:var(--ink-2);margin:4px 0 0}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto}
nav button{all:unset;cursor:pointer;padding:10px 14px;color:var(--ink-2);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;margin-bottom:14px}
.ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.ctl label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2);min-width:0}
select,input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0;max-width:100%}
.xbar{display:flex;justify-content:flex-end;margin:6px 0 8px}button.btn.xl{border-color:var(--good);color:var(--good);font-weight:600}
.topbar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}.topbar nav{flex:1 1 100%;min-width:0;margin-top:6px}.upd{order:-1;width:100%;display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:13px;flex-wrap:wrap}a.btn.up-btn{font:inherit;font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:6px;background:var(--blue);color:#fff;text-decoration:none;white-space:nowrap}
button.btn{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}
button.btn[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.chip{background:var(--soft);border-radius:8px;padding:8px 10px;min-width:0}
.chip small{display:block;color:var(--ink-2);font-size:11.5px}.chip b{font-variant-numeric:tabular-nums;font-size:15px}
.chartbox{position:relative;margin-top:12px}
svg.c{display:block;width:100%}
svg text{fill:var(--ink-2);font-size:11px;font-family:inherit}
svg .gl{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);white-space:nowrap;z-index:2;font-variant-numeric:tabular-nums}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px;max-height:360px}
.tw.tall{max-height:560px}.tw.flat{max-height:none}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th:first-child,td:first-child,td.l,th.l{text-align:left}
th{background:var(--soft);position:sticky;top:0;font-weight:600}
th button{all:unset;cursor:pointer;font-weight:600}th button:focus-visible{outline:2px solid var(--accent)}
tbody tr.sel{background:var(--soft)}tbody tr.pick{cursor:pointer}tbody tr.pick:hover{background:var(--soft)}
tr:last-child td{border-bottom:0}
.up{color:var(--up)}.dn{color:var(--down)}.mut{color:var(--ink-3)}
.note{background:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.filter{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
.ans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px;margin-top:12px}
.ans div{background:var(--soft);border-radius:8px;padding:10px 12px;min-width:0}
.ans b{display:block;font:600 19px/1.3 'Noto Serif KR',serif;font-variant-numeric:tabular-nums}
.ans span{font-size:12.5px;color:var(--ink-2)}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart .grid{stroke:var(--line);stroke-width:1}.chart .base{stroke:var(--ink-3);stroke-width:1}
.chart .ax{fill:var(--ink-2);font-size:11.5px}.chart .ax2{fill:var(--ink-3);font-size:10.5px}
.chart .vl{fill:var(--ink);font-size:12px;font-weight:600}.chart .axl{fill:var(--ink-2);font-size:11.5px;font-weight:600}
details{margin-top:8px}summary{cursor:pointer;color:var(--accent)}
.cw{display:grid;grid-template-columns:minmax(0,1fr) 232px;gap:14px;align-items:start;margin-top:12px}
.cw .chartbox{margin-top:0}
.tools{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg);min-width:0;font-size:13px}
.tools h4{margin:0 0 8px;font-size:14px}
.tools .modes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tools .modes .btn{padding:6px 4px;font-size:12.5px}
.tools .hint{color:var(--ink-2);font-size:12px;margin:8px 0}
.tools ol{margin:8px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.tools li{border:1px solid var(--line);border-radius:6px;padding:7px 8px;background:var(--panel);position:relative;padding-right:26px;font-variant-numeric:tabular-nums}
.tools li b{font-size:15px}.tools li small{color:var(--ink-3);display:block}
.tools li button{all:unset;cursor:pointer;position:absolute;top:5px;right:8px;color:var(--ink-3);font-size:16px;line-height:1}
.tools li button:focus-visible{outline:2px solid var(--accent)}
.tools .row{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:780px){.cw{grid-template-columns:minmax(0,1fr)}}
[hidden]{display:none!important}
</style>
<style>.wrap{max-width:1360px}</style>
<div class="wrap">
<h1>상승률 200</h1>
<div class="topbar"><nav role="tablist">
<button role="tab" data-tab="calendar" aria-selected="true">당일 상승 200</button>
<button role="tab" data-tab="reasons" aria-selected="false">상승 이유</button>
<button role="tab" data-tab="map" aria-selected="false">시장 지도</button>
</nav><div class="upd"><span id="upd-t" class="mut"></span></div></div>

<section id="p-calendar">
<div class="card">
<div class="ctl">
<label>날짜<input type="date" id="dt" min="2020-01-02" max="{{LAST}}"></label>
<button class="btn" id="prev">◀ 이전 거래일</button><button class="btn" id="next">다음 거래일 ▶</button><button class="btn" id="today">최근 거래일</button>
<label>시장<select id="mk"><option value="">전체</option><option>KOSPI</option><option>KOSDAQ</option></select></label>
<label>최소 거래대금(억)<input type="number" id="mv" value="0" min="0" step="10" style="width:110px"></label>
<button type="button" class="btn xl" data-x="calendar">엑셀 다운로드</button>
<label>차트 기간<select id="cn"><option value="60">약 3개월</option><option value="120" selected>약 6개월</option><option value="250">약 1년</option></select></label>
</div>
<p class="sub" id="cal-sum" style="margin-top:12px"></p>
<div id="t2c" hidden style="margin-top:10px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h3 id="t2-title" style="margin:6px 0 0;font-size:15px;flex:1;min-width:0"></h3><button class="btn" id="t2x" type="button">차트 닫기</button></div><div id="cb2"></div></div>
<div class="tw" style="max-height:640px" id="tw2"></div>
</div></section>

<section id="p-reasons" hidden>
<div class="card">
<div class="ctl" style="margin-top:10px">
<label>날짜<select id="rs-dt" aria-label="날짜 선택" style="min-width:150px"></select></label>
<label>종목명 검색<input type="search" id="rs-q" placeholder="예: 삼성"></label>
<label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="rs-up" checked> 상승 기사만</label>
<label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="rs-top"> 상위 200에 든 종목만</label>
<button type="button" class="btn xl" data-x="reasons">엑셀 다운로드</button>
</div>
<p class="sub" id="rs-sum" style="margin-top:12px"></p>
<div class="tw tall" id="tw5"></div>
</div></section>

<style>
/* ===== 시장 지도 탭 (상승률 200 전용). 모두 #p-map 안에서만 적용됩니다 ===== */
#p-map{--card:var(--panel)}
#p-map .mp-eras{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
#p-map .mp-eras::-webkit-scrollbar{display:none}
#p-map .mp-eras button{all:unset;box-sizing:border-box;cursor:pointer;flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 12px;font-size:12.5px;white-space:nowrap;border-left:4px solid var(--up);line-height:1.3;color:var(--ink)}
#p-map .mp-eras button small{display:block;font-size:10.5px;color:var(--ink-2)}
#p-map .mp-eras button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#p-map .mp-eras button[aria-current="true"] small{color:inherit;opacity:.75}
#p-map button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#p-map .mp-main{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:980px){#p-map .mp-main{grid-template-columns:minmax(0,1.4fr) minmax(330px,.6fr);align-items:start}
  #p-map .mp-panel{max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:8px}}
#p-map .mp-col{display:flex;flex-direction:column;gap:8px;min-width:0}
#p-map .mp-wrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft);height:58vh;min-height:380px}
@media(min-width:980px){#p-map .mp-wrap{height:calc(100vh - 330px);min-height:460px}}
#mp-tm{position:absolute;inset:0;width:100%;height:100%;display:block}
#mp-tm .tile{cursor:pointer}#mp-tm .tile rect{stroke:var(--panel);stroke-width:1}#mp-tm .tile:hover rect{stroke:var(--ink);stroke-width:2}
#mp-tm .tile.sel rect{stroke:var(--ink);stroke-width:3}
#mp-tm text{pointer-events:none;font-family:inherit}
#mp-tm .gl{fill:var(--ink-2);font-size:11px;font-weight:600}
#p-map .mp-top{position:absolute;left:10px;top:10px;display:flex;gap:6px;z-index:2}
#p-map .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
#p-map .seg button{all:unset;cursor:pointer;padding:5px 12px;font-size:12.5px;color:var(--ink-2)}
#p-map .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#p-map .mp-hint{position:absolute;left:10px;bottom:8px;z-index:2;font-size:11.5px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;max-width:calc(100% - 20px)}
#mp-chartview{position:absolute;inset:0;overflow:auto;padding:52px 12px 12px;background:var(--panel)}
#mp-chartview[hidden]{display:none}
#mp-tip{position:absolute;z-index:3;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:6px;max-width:260px;display:none}
#p-map .mp-tlbox{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 12px}
#p-map .mp-tlhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#p-map .mp-dt{flex:1;min-width:150px;text-align:center}
#p-map .mp-dt b{font:600 17px 'Noto Serif KR',serif;display:block}#p-map .mp-dt small{color:var(--ink-2);font-size:12px}
#p-map .b2{all:unset;cursor:pointer;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap}
#p-map .b2:hover{border-color:var(--ink-2)}#p-map .b2[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
#p-map .mp-tlhead select,#p-map .mp-tlhead input[type=date]{font:inherit;font-size:13px;padding:5px 8px}
#mp-tl{position:relative;height:58px;margin-top:8px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
#mp-tl canvas{position:absolute;inset:0;width:100%;height:100%}
#mp-tlyr{position:relative;height:16px;font-size:10.5px;color:var(--ink-3)}#mp-tlyr span{position:absolute;transform:translateX(-50%)}
#p-map .mp-panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
#p-map .mp-panel h2{margin:0;font:600 21px 'Noto Serif KR',serif}#p-map .mp-panel h2 small{font:400 12px sans-serif;color:var(--ink-2);margin-left:6px}
#p-map .mp-lead{margin:6px 0 10px;color:var(--ink-2)}
#p-map .pchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
#p-map .pchip{all:unset;cursor:pointer;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:3px 11px;font-size:12.5px;color:var(--ink)}
#p-map .pchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#p-map .pchip small{color:inherit;opacity:.7;margin-left:3px}
#p-map .mp-panel input[type=search]{width:100%;box-sizing:border-box;margin:4px 0 8px}
#p-map .sel-card{border-left:4px solid var(--up);background:var(--soft);border-radius:6px;padding:10px 12px;margin:8px 0}
#p-map .sel-card h3{margin:0;font-size:16px}#p-map .sel-card .kv{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0;font-size:12.5px;color:var(--ink-2)}#p-map .sel-card .kv b{color:var(--ink)}
#p-map .sel-card ul{margin:6px 0 0;padding-left:18px;font-size:13px}#p-map .sel-card li{margin:3px 0}
#p-map ol.mlst{list-style:none;margin:6px 0 0;padding:0}
#p-map ol.mlst li{border-top:1px solid var(--line)}
#p-map ol.mlst button{all:unset;cursor:pointer;display:grid;grid-template-columns:26px 1fr auto;gap:2px 8px;width:100%;box-sizing:border-box;padding:7px 4px}
#p-map ol.mlst button:hover,#p-map ol.mlst li.sel button{background:var(--soft)}
#p-map ol.mlst .rk{color:var(--ink-3);font-size:12px;text-align:right;grid-row:span 2}
#p-map ol.mlst .nm{font-weight:600}
#p-map ol.mlst .rt{color:var(--up);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
#p-map ol.mlst .rs{grid-column:2/4;font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#p-map ol.mlst mark{background:#ffe27a;color:#222;border-radius:2px}
#p-map .mp-memo{width:100%;box-sizing:border-box;min-height:90px;margin-top:8px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
#p-map .mp-memo[hidden]{display:none}
#p-map .mp-empty{padding:30px 10px;text-align:center;color:var(--ink-2)}
</style>
<section id="p-map" hidden>
<div class="mp-eras" id="mp-eras" aria-label="연도 바로가기"></div>

</div>

</div>
<aside class="mp-panel">

<p class="mp-lead" id="mp-lead"></p>
<div class="pchips" id="mp-mk"></div>
<div class="pchips" id="mp-th"></div>
<input type="search" id="mp-q" placeholder="종목명·상승 이유·테마 검색" aria-label="검색">
<div id="mp-sel"></div>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0"><button type="button" class="b2" id="mp-memob">📝 내 메모</button><button type="button" class="b2" id="mp-xl">엑셀 다운로드</button></div>

</aside>
</div>
</section>
</div>
<script>const $=(s,r=document)=>r.querySelector(s);
const fmt=n=>n==null?'–':Math.round(n).toLocaleString('ko-KR');

document.addEventListener('click',async ev=>{const b=ev.target.closest('button[data-x="cand"]');if(!b)return;
  await saveXlsx([['종목명','종목코드','시장','상승 시작일',$('#c-win').value+'일 상승률(%)','일평균 거래대금(억)','시가총액(억)','고점일','고점','현재가','기준일','고점 대비 현재(%)','고점 이후 최저(%)','고점 후 경과(거래일)','하락·반등(참고)'],...T6X],'candidates_'+$('#c-win').value+'d_'+$('#c-rise').value+'_'+$('#c-val').value,'후보종목')});
</script><script>/* ---------- 탭: 시장 지도 (업종 트리맵 · 연도 칩 · 타임라인 바) ----------
   기존 탭 코드의 $, fmt, f1, ld, ldz, DATES, MKT, TICK/loadTick, TH/loadTh, RSMAP/loadRs, topMonth, stockRows,
   mountChart, saveXlsx, esc, safeUrl 을 그대로 씁니다. 이름이 겹치지 않도록 이 파일은 함수 하나로 감쌉니다. */
window.tabMap=(()=>{
const WD=['일','월','화','수','목','금','토'];
let inited=false,SPK={s:0,a:[],u:[]},DAYM=null,busy=false,STRONG=[];
const S={di:0,mk:'',th:'',q:'',sel:null,view:'map',play:null};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
const E=id=>document.getElementById('mp-'+id);

/* 하루치 데이터 */
async function loadDayM(di){
  const date=DATES[di],m=await topMonth(date.slice(0,7)),rows=m[di]||[];
  const TD=TH[date]||{top:[],map:{}};
  const items=rows.map((r,k)=>{const t=TICK[r[0]],L=RSMAP[date+'|'+t[1]]||[],a=L.find(z=>z.dir!=='down');
    return {rk:k+1,ti:r[0],code:t[0],name:t[1],mkt:t[2],ind:t[3]||'',rate:r[1],val:r[2],close:r[3],mc:r[4],why:a?(a.r||a.h):'',url:a?a.u:'',src:a?(a.s||''):'',L,th:TD.map[t[1]]||''}});
  const withInd=items.filter(x=>x.ind).length,byInd=items.length>0&&withInd>=items.length*.5;
  items.forEach(x=>{x.grp=byInd?(x.ind||'기타'):(x.mkt==='KOSPI'?'코스피':'코스닥')});
  return {date,items,TD,byInd,n:rows.length};
}
function filt(){const q=S.q.trim().toLowerCase();
  return DAYM.items.filter(x=>(!S.mk||x.mkt===S.mk)&&(!S.th||x.th===S.th)&&(!q||x.name.toLowerCase().includes(q)||x.why.toLowerCase().includes(q)||x.th.toLowerCase().includes(q)||x.ind.toLowerCase().includes(q)))}

/* 트리맵 */
function squarify(items,x,y,w,h){const out=[];const total=items.reduce((s,i)=>s+i.v,0);if(!total||w<=0||h<=0)return out;
  const k=(w*h)/total,arr=items.map(i=>({i,a:i.v*k}));let row=[],rx=x,ry=y,rw=w,rh=h;
  const worst=(r,side)=>{const s=r.reduce((t,q)=>t+q.a,0);let mx=0,mn=1e18;r.forEach(q=>{mx=Math.max(mx,q.a);mn=Math.min(mn,q.a)});return Math.max(side*side*mx/(s*s),(s*s)/(side*side*mn))};
  const lay=r=>{const s=r.reduce((t,q)=>t+q.a,0);
    if(rw>=rh){const cw=s/rh;let cy=ry;r.forEach(q=>{const ch=q.a/cw;out.push({i:q.i,x:rx,y:cy,w:cw,h:ch});cy+=ch});rx+=cw;rw-=cw}
    else{const ch=s/rw;let cx=rx;r.forEach(q=>{const cw=q.a/ch;out.push({i:q.i,x:cx,y:ry,w:cw,h:ch});cx+=cw});ry+=ch;rh-=ch}};
  for(const it of arr){const side=Math.min(rw,rh);if(!row.length||worst(row.concat(it),side)<=worst(row,side))row.push(it);else{lay(row);row=[it]}}
  if(row.length)lay(row);return out}
const shade=r=>{const a=Math.round(22+Math.min(Math.max(r,0),30)/30*68);return `color-mix(in srgb,var(--up) ${a}%,var(--panel))`};
function drawMap(){
  const svg=E('tm'),box=E('wrap'),W=box.clientWidth,H=box.clientHeight;if(!W||!DAYM)return;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const list=filt();
  if(!list.length){svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" style="fill:var(--ink-2);font-size:14px">${DAYM.n?'조건에 맞는 종목이 없습니다.':'이 날짜는 자료가 없습니다(휴장일).'}</text>`;E('hint').textContent='';return}
  const g={};list.forEach(x=>{(g[x.grp]=g[x.grp]||{name:x.grp,kids:[],v:0}).kids.push(x)});
  const groups=Object.values(g).map(o=>{o.kids.forEach(k=>k.v=Math.max(k.val,3));o.kids.sort((a,b)=>b.v-a.v);o.v=o.kids.reduce((s,k)=>s+k.v,0);return o}).sort((a,b)=>b.v-a.v);
  const top=44,pad=4,rects=squarify(groups,pad,top,W-pad*2,H-top-pad);let out='';
  rects.forEach(R=>{const G=R.i,hh=R.w>60&&R.h>34?15:0,ix=R.x+2,iy=R.y+2+hh,iw=R.w-4,ih=R.h-4-hh,mx=Math.max(1,Math.floor(R.w/11));
    if(hh)out+=`<text class="gl" x="${R.x+5}" y="${R.y+14}">${esc(G.name.length>mx?G.name.slice(0,Math.max(1,mx-1))+'…':G.name)} · ${G.kids.length}</text>`;
    squarify(G.kids,ix,iy,iw,ih).forEach(T=>{const k=T.i,big=T.w>58&&T.h>30,mid=T.w>40&&T.h>20,c=Math.max(1,Math.floor(T.w/12));
      const nm=k.name.length>c?k.name.slice(0,Math.max(1,c-1))+'…':k.name;
      out+=`<g class="tile${S.sel===k.ti?' sel':''}" data-ti="${k.ti}" tabindex="0" role="button" aria-label="${esc(k.name)} +${f1(k.rate)}%"><rect x="${T.x}" y="${T.y}" width="${Math.max(0,T.w)}" height="${Math.max(0,T.h)}" rx="3" fill="${shade(k.rate)}"/>`+
        (mid?`<text x="${T.x+5}" y="${T.y+15}" font-size="12" font-weight="600" style="fill:var(--ink)">${esc(nm)}</text>`:'')+
        (big?`<text x="${T.x+5}" y="${T.y+30}" font-size="11.5" style="fill:var(--ink)">+${f1(k.rate)}%</text>`:'')+`</g>`});
  });
  svg.innerHTML=out;
  E('hint').textContent=`칸 크기=거래대금 · 색=상승률 · ${DAYM.byInd?'업종별':'시장별'} · ${list.length}종목`;
}

/* 패널 */
function renderPanel(){

}
function renderSel(){

  E('sel').innerHTML=k?`<div class="sel-card"><h3>${esc(k.name)} <small style="font-weight:400;color:var(--ink-2)">${k.code} · ${MKT(k.mkt)}</small></h3>
  <div class="kv"><span>상승률 <b style="color:var(--up)">+${f1(k.rate)}%</b></span><span>거래대금 <b>${fmt(k.val)}억</b></span><span>시가총액 <b>${k.mc==null?'–':fmt(k.mc)+'억'}</b></span><span>종가 <b>${fmt(k.close)}</b></span>${k.ind?`<span>업종 <b>${esc(k.ind)}</b></span>`:''}${k.th?`<span>테마 <b>${esc(k.th)}</b></span>`:''}</div>
  ${k.L.length?`<ul>${k.L.slice(0,5).map(a=>`<li><a href="${esc(safeUrl(a.u))}" target="_blank" rel="noopener noreferrer">${esc(a.r||a.h)}</a> <span style="color:var(--ink-3);font-size:11.5px">${esc(a.s||'')}</span></li>`).join('')}</ul>`:'<div style="font-size:12.5px;color:var(--ink-2)">연결된 공시·뉴스가 없습니다 (수급/테마 가능성).</div>'}</div>`:'';
}
const hl=(s,q)=>{s=esc(s);if(!q)return s;const e=esc(q),i=s.toLowerCase().indexOf(e.toLowerCase());return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+e.length)+'</mark>'+s.slice(i+e.length)};
function renderList(){const L=filt(),q=S.q.trim();
  E('list').innerHTML=L.length?L.map(x=>`<li class="${S.sel===x.ti?'sel':''}"><button type="button" data-ti="${x.ti}"><span class="rk">${x.rk}</span><span class="nm">${hl(x.name,q)}<small style="font-weight:400;color:var(--ink-3)"> ${esc(x.ind||MKT(x.mkt))}</small></span><span class="rt">+${f1(x.rate)}%</span><span class="rs">${x.why?hl(x.why,q):(x.th?'테마: '+hl(x.th,q)+' · 뉴스·공시 미확인':'수급/테마 (뉴스 미확인)')}</span></button></li>`).join(''):`<li class="mp-empty">${DAYM.n?'조건에 맞는 종목이 없습니다.':'자료가 없습니다.'}</li>`;
}
async function pick(ti,toChart){S.sel=ti;renderSel();renderList();if(S.view==='map')drawMap();if(toChart)setView('chart');else if(S.view==='chart')await drawChartView()}

/* 일봉 차트 화면 */
async function drawChartView(){
  const k=DAYM.items.find(x=>x.ti===S.sel),box=E('cb');
  if(!k){E('ct').textContent='지도나 목록에서 종목을 고르면 일봉이 나옵니다.';box.replaceChildren();box._shell=0;return}

    if(!rows.length||!rp){E('ct').textContent=k.name+': 이 날짜 주변 시세가 없습니다.';box.replaceChildren();box._shell=0;return}
    E('ct').textContent=`${k.name} (${MKT(k.mkt)}) 일봉 · 선택일 ${DATES[di]} · 아래 막대 거래대금(억원)`;
    mountChart(box,rows,{key:'m'+k.ti+'_'+di,marks:[{di,t:'선택일'}],ref:{p:rp[4],t:'선택일 종가 대비'},label:k.name+' 일봉'});
  }catch(e){E('ct').textContent='시세를 불러오지 못했습니다. 잠시 뒤 다시 눌러 주세요.'}}
function setView(v){S.view=v;E('vmap').setAttribute('aria-pressed',v==='map');E('vchart').setAttribute('aria-pressed',v==='chart');

/* 타임라인 바 · 연도 칩 */
function drawTl(){
  const c=E('tlc'),box=E('tl');if(!SPK.a.length||!box.clientWidth)return;const dpr=window.devicePixelRatio||1,W=box.clientWidth,H=box.clientHeight;
  c.width=W*dpr;c.height=H*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.documentElement),up=cs.getPropertyValue('--up').trim()||'#c23b30',ink=cs.getPropertyValue('--ink').trim()||'#222';
  const n=DATES.length-SPK.s,mx=Math.max(...SPK.a.slice(SPK.s),1),bw=Math.max(1,W/n);

}
function drawYears(){const n=DATES.length-SPK.s;let h='',last='';
  for(let i=SPK.s;i<DATES.length;i++){const y=DATES[i].slice(0,4);if(y!==last){last=y;h+=`<span style="left:${(i-SPK.s+.5)/n*100}%">${y}</span>`}}
  E('tlyr').innerHTML=h}
function buildEras(){const ys={};for(let i=SPK.s;i<DATES.length;i++){const y=DATES[i].slice(0,4);(ys[y]=ys[y]||[]).push(i)}
  E('eras').innerHTML=Object.entries(ys).map(([y,ix])=>{const best=ix.reduce((a,b)=>SPK.a[b]>SPK.a[a]?b:a);return `<button type="button" data-i="${best}" data-y="${y}">${y}년<small>${ix.length}거래일 · 최고 급등일 ${DATES[best].slice(5)}</small></button>`}).join('')}
function markEra(){document.querySelectorAll('#mp-eras button').forEach(b=>b.setAttribute('aria-current',b.dataset.y===DATES[S.di].slice(0,4)))}
function tlPick(ev){const r=E('tl').getBoundingClientRect(),n=DATES.length-SPK.s;go(SPK.s+Math.min(n-1,Math.max(0,Math.floor((ev.clientX-r.left)/r.width*n))))}

/* 이동·재생 */
async function go(di){di=Math.min(DATES.length-1,Math.max(SPK.s,di));if(di===S.di&&DAYM)return;S.di=di;await refresh(true)}
async function refresh(day){
  if(busy)return;busy=true;try{
    if(day||!DAYM||DAYM.date!==DATES[S.di])DAYM=await loadDayM(S.di);
    const d=new Date(DAYM.date+'T00:00:00');
    E('dtt').textContent=DAYM.date;E('dts').textContent=`${WD[d.getDay()]}요일 · 상위 10개 평균 +${f1(SPK.a[S.di])}% · 29.5%↑ ${SPK.u[S.di]}종목`;
    E('pick').value=DAYM.date;renderPanel();drawTl();markEra();
    if(S.view==='map')drawMap();else await drawChartView();
  }finally{busy=false}}
function stop(){if(S.play){clearInterval(S.play);S.play=null}E('play').setAttribute('aria-pressed',false);E('play').textContent='▶'}
const step=d=>{stop();go(S.di+d)};
const timer=()=>setInterval(async()=>{if(S.di>=DATES.length-1){stop();return}await go(S.di+1)},+E('spd').value);

function bind(){
  E('tm').addEventListener('mousemove',ev=>{const tip=E('tip'),g=ev.target.closest('.tile');if(!g){tip.style.display='none';return}
    const k=DAYM.items.find(x=>x.ti===+g.dataset.ti);if(!k)return;const r=E('wrap').getBoundingClientRect();
    tip.innerHTML=`<b>${esc(k.name)}</b> ${esc(k.grp)}<br>+${f1(k.rate)}% · 거래대금 ${fmt(k.val)}억<br>${k.why?esc(k.why):'<span style="opacity:.7">이유 미확인</span>'}`;
    tip.style.display='block';tip.style.left=Math.max(0,Math.min(ev.clientX-r.left+12,r.width-270))+'px';tip.style.top=(ev.clientY-r.top+14)+'px'});
  E('tm').addEventListener('mouseleave',()=>E('tip').style.display='none');
  E('tm').addEventListener('click',ev=>{const g=ev.target.closest('.tile');if(g)pick(+g.dataset.ti,true)});
  E('tm').addEventListener('keydown',ev=>{if(ev.key==='Enter'){const g=ev.target.closest('.tile');if(g)pick(+g.dataset.ti,true)}});
  E('list').addEventListener('click',ev=>{const b=ev.target.closest('button[data-ti]');if(b)pick(+b.dataset.ti,true)});
  E('mk').addEventListener('click',ev=>{const m=ev.target.closest('[data-mk]');if(m){S.mk=m.dataset.mk;renderPanel();if(S.view==='map')drawMap()}});
  E('th').addEventListener('click',ev=>{const t=ev.target.closest('[data-th]');if(t){S.th=S.th===t.dataset.th?'':t.dataset.th;renderPanel();if(S.view==='map')drawMap()}});
  E('q').addEventListener('input',()=>{S.q=E('q').value;renderList();if(S.view==='map')drawMap()});

  E('eras').addEventListener('click',ev=>{const b=ev.target.closest('button[data-i]');if(b){stop();go(+b.dataset.i)}});
  let drag=false;const tl=E('tl');
  tl.addEventListener('pointerdown',ev=>{drag=true;tl.setPointerCapture(ev.pointerId);stop();tlPick(ev)});
  tl.addEventListener('pointermove',ev=>{if(drag)tlPick(ev)});tl.addEventListener('pointerup',()=>drag=false);
  E('prev').onclick=()=>step(-1);E('next').onclick=()=>step(1);
  E('prevs').onclick=()=>{stop();const p=[...STRONG].reverse().find(i=>i<S.di);if(p!=null)go(p)};
  E('nexts').onclick=()=>{stop();const n=STRONG.find(i=>i>S.di);if(n!=null)go(n)};
  E('pick').onchange=()=>{const v=E('pick').value;if(!v)return;stop();let i=DATES.indexOf(v);if(i<0){const j=DATES.findIndex(x=>x>v);i=j<0?DATES.length-1:Math.max(SPK.s,j-1)}go(i)};
  E('play').onclick=()=>{if(S.play){stop();return}E('play').setAttribute('aria-pressed',true);E('play').textContent='⏸';if(S.di>=DATES.length-1)S.di=SPK.s;S.play=timer()};
  E('spd').onchange=()=>{if(S.play){clearInterval(S.play);S.play=timer()}};
  document.addEventListener('keydown',ev=>{if($('#p-map').hidden||/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName))return;if(ev.key==='ArrowLeft')step(-1);if(ev.key==='ArrowRight')step(1)});
  E('xl').onclick=async()=>{if(!DAYM)return;const b=E('xl'),t0=b.textContent;b.disabled=true;b.textContent='만드는 중...';
    try{await saveXlsx([['순위','종목명','종목코드','시장','업종','상승률(%)','거래대금(억)','시가총액(억)','종가','상승 이유','테마','근거 링크','출처'],
      ...filt().map(x=>[x.rk,x.name,x.code,MKT(x.mkt),x.ind,x.rate,x.val,x.mc,x.close,x.why||'수급/테마 (뉴스 미확인)',x.th,x.url,x.src])],'rank200_'+DAYM.date,'시장지도')}
    finally{b.disabled=false;b.textContent=t0}};
  new ResizeObserver(()=>{if(!inited||$('#p-map').hidden)return;if(S.view==='map')drawMap();drawTl()}).observe(E('wrap'));
  const mq=matchMedia('(prefers-color-scheme:dark)');mq.addEventListener&&mq.addEventListener('change',()=>{if(inited&&!$('#p-map').hidden){drawTl();if(S.view==='map')drawMap()}});
}

return async function tabMap(){
  if(inited){drawTl();if(S.view==='map')drawMap();return}
  const sp=await ld('data/spark.json');
  await Promise.all([loadTick(),loadTh(),loadRs()]);
  SPK=sp;inited=true;bind();
  const vals=SPK.a.slice(SPK.s).filter(v=>v>0).sort((a,b)=>a-b),p90=vals[Math.floor(vals.length*.9)]||0;
  for(let i=SPK.s;i<DATES.length;i++)if(p90>0&&SPK.a[i]>=p90)STRONG.push(i);
  buildEras();drawYears();E('pick').min=DATES[SPK.s];E('pick').max=DATES[DATES.length-1];
  S.di=-1;await go(DATES.length-1);
};
})();
</script>
